<!DOCTYPE html>
<!--
  index.html
  Main page of the game. It has the canvas, the HUD and all screens
  (menu, warning, pause, game over).
  - Text comes from src/i18n.js (see the data-i18n attributes).
  - Game code starts at src/main.js.
  - Styles are in the css/ folder.
-->
<html lang="en">
<head>
<!-- Page settings: size on phones, theme color and app (PWA) info -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070A">
<meta name="description" content="CIREEP - a horror mini game. Catch the data packets and avoid Cireep.">
<title>CIREEP</title>
<!-- Install as an app: manifest and icons -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CIREEP">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="icon" href="img/icon-192.png" type="image/png">
<!-- Title font (Chakra Petch) from Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<!-- Styles. Keep this order: a later file can override an earlier file.
     The build tool joins them into one style.css. -->
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/effects.css">
<link rel="stylesheet" href="css/hud.css">
<link rel="stylesheet" href="css/screens.css">
<link rel="stylesheet" href="css/buttons.css">
<link rel="stylesheet" href="css/ingame.css">
<link rel="stylesheet" href="css/menu.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<!-- Game box. data-mode (menu, play, pause...) is set from JS -->
<div id="wrap" data-mode="menu">
  <!-- Game picture is drawn here -->
  <canvas id="game"></canvas>
  <!-- Effect layers on top of the canvas -->
  <div class="vig"></div>
  <div class="fx" id="fxFrost"></div>
  <div class="fx" id="fxFire"></div>
  <div class="fx" id="fxFlick"></div>

  <!-- HUD: score, REC timer, lives and chaos level -->
  <div id="hud">
    <div class="stat">
      <b id="score">0</b> 
      <span data-i18n="score">Score</span>
      <span id="rec" class="rec">● REC 00:00</span>
    </div>
    <div class="right">
      <div id="eyes"></div>
      <div class="stat"><span id="caughtLbl">0</span></div>
      <div id="chaosTag"></div>
    </div>
  </div>

  <!-- Pause button and countdown number -->
  <button class="ghost iconbtn" id="pauseBtn" type="button" aria-label="Pause">
    <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></svg>
  </button>
  <div id="count" class="count hidden" aria-live="assertive"></div>

  <!-- Menu screen -->
  <div class="screen" id="menu">
    <div class="menu-grid">
      <div class="col-main">
        <p class="file" data-i18n="fileTag"></p>
        <h1 class="title" data-text="CIREEP">CIREEP</h1>
        <p class="sub" data-i18n-html="menuSub"></p>
        <button id="startBtn" data-i18n="start"></button>
        <p class="warn" data-i18n-html="warn"></p>
        <!-- Settings buttons are added here by ui.js -->
        <div class="settings"></div>
      </div>
      <div class="col-side">
        <div class="rules">
          <div><i>[+]</i><span data-i18n="r1"></span></div>
          <div><i>[!]</i><span data-i18n="r2"></span></div>
          <div><i>[~]</i><span data-i18n="r3"></span></div>
          <div><i>[↔]</i><span data-i18n="r4"></span></div>
          <div><i>[*]</i><span data-i18n="r5"></span></div>
          <div><i>[^]</i><span data-i18n="r6"></span></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Warning screen (16+) before the game starts -->
  <div class="screen hidden" id="warnScr" role="alertdialog" aria-modal="true" aria-labelledby="warnTitle" aria-describedby="warnBody">
    <h2 class="title over" id="warnTitle" data-i18n="warnTitle" data-text=""></h2>
    <p class="sub" id="warnBody" data-i18n-html="warnBody"></p>
    <p class="sub small" data-i18n-html="warnHint"></p>
    <div class="btnrow">
      <button id="warnBack" class="alt" data-i18n="warnBack"></button>
      <button id="warnOk" data-i18n="warnOk"></button>
    </div>
  </div>

  <!-- Pause screen -->
  <div class="screen hidden" id="pauseScr">
    <h2 class="title mid" data-i18n="paused" data-text=""></h2>
    <div class="btnrow">
      <button id="resumeBtn" data-i18n="resume"></button>
      <button id="quitBtn" class="alt" data-i18n="quit"></button>
    </div>
    <div class="settings"></div>
  </div>

  <!-- Game over screen -->
  <div class="screen hidden" id="over">
    <h2 class="title over" id="overTitle" data-i18n="overTitle" data-text=""></h2>
    <div class="finalRow">
      <div class="stat"><b id="fScore">0</b><span data-i18n="score"></span></div>
      <div class="stat"><b id="fCaught">0</b><span data-i18n="packets"></span></div>
      <div class="stat"><b id="fBest">0</b><span data-i18n="best"></span></div>
    </div>
    <p class="sub" id="overLine" data-i18n="over2"></p>
    <div class="btnrow">
      <button id="againBtn" data-i18n="again"></button>
      <button id="overMenuBtn" class="alt" data-i18n="quit"></button>
    </div>
    <div class="settings"></div>
  </div>
</div>

<!-- Game code. The build tool replaces this tag with game.js -->
<script type="module" src="src/main.js"></script>
</body>
</html>
